<c-row ngPreserveWhitespaces>
    <c-col xs="12">
        <c-card class="mb-1">
            <c-card-header>
                <strong>Subjefatura del BCBSD</strong>
            </c-card-header>
            <c-card-body>
                <p class="text-body-secondary small">
                    Resumen de acciones de la Subjefatura de Bomberos
                </p>
                <!-- <p class="text-body-secondary small">
                    BCBSD
                </p> -->
                <c-row class="mb-1">
                    <c-col md="3">
                        <label cLabel for="estacion">Estacion</label>
                        <c-input-group class="has-validation">
                            <span cInputGroupText><i class="fa fa-fire-extinguisher"></i></span>
                            <select cSelect id="estacion" name="estacion" [(ngModel)]="estacionId">
                                <option value="0">-Todas las Estaciones-</option>
                                <option *ngFor="let estacion of estaciones" [value]="estacion.estacion_id">{{ estacion.estacion_nombre }} </option>
                            </select>
                        </c-input-group>
                    </c-col>
                    <c-col sm="3" class="mb-1">
                        <label cLabel class="required-label" for="desde">Desde</label>
                        <c-input-group class="has-validation">
                            <span cInputGroupText><i class="fa fa-calendar"></i></span>
                            <input cFormControl id="desde" name="desde" [(ngModel)]="fechaDesde" type="date" />
                        </c-input-group>
                    </c-col>
                    <c-col sm="3" class="mb-1">
                        <label cLabel class="required-label" for="hasta">Hasta</label>
                        <c-input-group class="has-validation">
                            <span cInputGroupText><i class="fa fa-calendar"></i></span>
                            <input cFormControl id="hasta" name="hasta" [(ngModel)]="fechaHasta" type="date" />
                        </c-input-group>
                    </c-col>
                    <c-col sm="2" class="mb-1 mt-4">
                        <button cButton color="primary" (click)="obtenerEstadisticas()" type="button"><i class="fa-solid fa-search"></i> Buscar</button>
                    </c-col>
                </c-row>
                <hr>
                <c-row class="mb-1">
                    <!-- <c-col md="12">
                        <div id="map"></div>
                    </c-col> -->
                    <br>
                    <c-col xl="4" lg="4" sm="6">
                        <c-widget-stat-c [title]="'Intervenciones'" color="success" inverse value="{{totalI}}">
                            <ng-template cTemplateId="widgetIconTemplate">
                                <i class="fa-solid fa-2x fa-fire" style="color: #ffffff;"></i>
                            </ng-template>
                            <ng-template cTemplateId="widgetProgressTemplate">
                                <c-progress class="mt-3 mb-0" thin white [value]="75" />
                            </ng-template>
                        </c-widget-stat-c>
                    </c-col>
                    <c-col xl="4" lg="4" sm="6">
                        <c-widget-stat-c [title]="'Beneficiarios'" color="info" inverse value="{{totalB}}">
                            <ng-template cTemplateId="widgetIconTemplate">
                                <i class="fa-solid fa-2x fa-hand-holding-heart" style="color: #ffffff;"></i>
                            </ng-template>
                            <ng-template cTemplateId="widgetProgressTemplate">
                                <c-progress class="mt-3 mb-0" thin white [value]="75" />
                            </ng-template>
                        </c-widget-stat-c>
                    </c-col>
                    <c-col xl="4" lg="4" sm="6">
                        <c-widget-stat-c [title]="'Fallecidos'" color="dark" inverse value="{{totalF}}">
                            <ng-template cTemplateId="widgetIconTemplate">
                                <i class="fa-solid fa-2x fa-cross" style="color: #ffffff;"></i>
                            </ng-template>
                            <ng-template cTemplateId="widgetProgressTemplate">
                                <c-progress class="mt-3 mb-0" thin white [value]="75" />
                            </ng-template>
                        </c-widget-stat-c>
                    </c-col>
                </c-row>
                <hr>
                <c-row class="mb-1">
                    <!-- <c-col md="12">
                        <div id="map"></div>
                    </c-col> -->
                    <br>
                    <c-col xl="4" lg="4" sm="6">
                        <c-widget-stat-c [title]="'Mes Crítico'" color="secondary" inverse value="{{mesCritico}}">
                            <ng-template cTemplateId="widgetIconTemplate">
                                <i class="fa-regular fa-2x fa-calendar" style="color: #ffffff;"></i>
                            </ng-template>
                            <ng-template cTemplateId="widgetProgressTemplate">
                                <c-progress class="mt-3 mb-0" thin white [value]="75" />
                            </ng-template>
                        </c-widget-stat-c>
                    </c-col>
                    <c-col xl="4" lg="4" sm="6">
                        <c-widget-stat-c [title]="'Día Crítico'" color="light"  value="{{diaCritico}}">
                            <ng-template cTemplateId="widgetIconTemplate">
                                <i class="fa-solid fa-2x fa-calendar-day"></i>
                            </ng-template>
                            <ng-template cTemplateId="widgetProgressTemplate">
                                <c-progress class="mt-3 mb-0" thin dark [value]="75" />
                            </ng-template>
                        </c-widget-stat-c>
                    </c-col>
                    <c-col xl="4" lg="4" sm="6">
                        <c-widget-stat-c [title]="'Hora Crítica'" color="danger" inverse value="{{horaCritica}}">
                            <ng-template cTemplateId="widgetIconTemplate">
                                <i class="fa-solid fa-2x fa-clock" style="color: #ffffff;"></i>
                            </ng-template>
                            <ng-template cTemplateId="widgetProgressTemplate">
                                <c-progress class="mt-3 mb-0" thin white [value]="75" />
                            </ng-template>
                        </c-widget-stat-c>
                    </c-col>
                </c-row>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
