<c-row ngPreserveWhitespaces>
    <c-col xs="12">
        <c-card class="mb-4">
            <c-card-header style="background-color: #bf0411;color: white;">

                <c-row>
                    <c-col xs="6">
                        <strong>Partes de Auxilio del BCBSD</strong>
                    </c-col>
                    <c-col xs="6">
                        <div class="d-grid gap-1 d-md-flex justify-content-md-end">
                            <button cButton color="secondary" size="sm" (click)="cargarDatos()"><i class="fa-solid fa-repeat"></i></button>
                            <a cButton routerLink="./nuevo" color="primary" size="sm"><i class="fa-solid fa-plus"></i> Nuevo</a>
                        </div>
                    </c-col>
                </c-row>
            </c-card-header>
            <c-card-body>
                <p class="text-body-secondary small">
                    Nota: Partes de Auxilio con su estado, para editarlos hacer clic en el icono <i class="fa-solid fa-2x fa-pencil" style="color: #5856d6;"></i>
                </p>

                <div class="mb-3">
                    <c-input-group>
                        <span cInputGroupText><i class="fa fa-weight-hanging"></i></span>
                        <input [(ngModel)]="filtroBusqueda" type="text" class="form-control" placeholder="Buscar..." name="filtroBusqueda" id="filtroBusqueda" />
                    </c-input-group>
                </div>

                <table [striped]="true" cTable [responsive]="true">
                    <thead>
                        <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Número</th>
                            <th scope="col">Menú</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let parte of partes" style="font-size: 12px;">
                            <td scope="row">
                                {{ parte.parte_fecha }}
                            </td>
                            <td>
                                {{ parte.parte_tipo }}
                            </td>
                            <td>
                                {{ parte.parte_numero }}
                            </td>
                            <td>
                                <a cButton routerLink="./{{parte.parte_id}}" color="primary" size="sm"><i class="fa-solid fa-pencil"></i></a> 
                                <!-- <c-button-group aria-label="Button group with nested dropdown" role="group">
                                    <c-dropdown variant="btn-group">
                                        <button cButton color="secondary" cDropdownToggle>
                                            <i class="fa-solid fa-list"></i>
                                        </button>
                                        <ul cDropdownMenu>
                                            <li><a cDropdownItem *ngIf="parte.distributivo_estado!='ESTACION'" routerLink="./{{parte.distributivo_id}}" color="primary" size="sm"><i class="fa-solid fa-pencil"></i> Editar</a></li>
                                        </ul>
                                    </c-dropdown>
                                </c-button-group> -->


                            </td>
                        </tr>
                    </tbody>
                </table>

            </c-card-body>
        </c-card>
    </c-col>
</c-row>
